BusinessObjects:

  KNA1:
    Domain: SAP_Stammdaten
    desc: >
      Repräsentiert die allgemeinen, mandantenweit gültigen Stammdaten
      eines SAP-Kunden aus der Tabelle KNA1.
    business_keys:
      - Mandant
      - KundeID
    sources:
      - KNA1
    attributes:
      - name: Mandant
        source: KNA1.MANDT
        type: char(3)
        nullable: false
        primary_key: true

      - name: KundeID
        source: KNA1.KUNNR
        type: char(10)
        nullable: false
        primary_key: true

      - name: Land
        source: KNA1.LAND1
        type: char(3)
        nullable: true

      - name: Name1
        source: KNA1.NAME1
        type: varchar(35)
        nullable: true

      - name: Name2
        source: KNA1.NAME2
        type: varchar(35)
        nullable: true

      - name: Ort
        source: KNA1.ORT01
        type: varchar(35)
        nullable: true

      - name: Postleitzahl
        source: KNA1.PSTLZ
        type: varchar(10)
        nullable: true

      - name: Region
        source: KNA1.REGIO
        type: char(3)
        nullable: true

      - name: Straße
        source: KNA1.STRAS
        type: varchar(35)
        nullable: true

      - name: Sprache
        source: KNA1.SPRAS
        type: char(1)
        nullable: true

      - name: Kundengruppe
        source: KNA1.KTOKD
        type: char(4)
        nullable: true

      - name: Erstellungsdatum
        source: KNA1.ERDAT
        type: date
        nullable: true

      - name: Löschkennzeichen
        source: KNA1.LOEVM
        type: char(1)
        nullable: true

    relationships:
      - to: Auftrag
        name: erteilt
        cardinality:
          from: exactly_one
          to: zero_or_many

      - to: Rechnung
        name: erhält
        cardinality:
          from: exactly_one
          to: zero_or_many


