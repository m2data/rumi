  MARC:
    Domain: SAP_Stammdaten
    desc: >
      Repräsentiert die werksspezifischen Materialstammdaten.
      Ein MARC-Datensatz gehört genau zu einem Material und einem Werk.
    business_keys:
      - Mandant
      - MaterialID
      - WerkID
    sources:
      - MARC
    attributes:
      - name: Mandant
        source: MARC.MANDT
        type: char(3)
        nullable: false
        primary_key: true

      - name: MaterialID
        source: MARC.MATNR
        type: char(40)
        nullable: false
        primary_key: true
        foreign_key: true
        references: MARA.MaterialID

      - name: WerkID
        source: MARC.WERKS
        type: char(4)
        nullable: false
        primary_key: true
        foreign_key: true
        references: T001W.WerkID

      - name: Dispositionsmerkmal
        source: MARC.DISMM
        type: char(2)
        nullable: true

      - name: Disponent
        source: MARC.DISPO
        type: char(3)
        nullable: true

      - name: Beschaffungsart
