meta:
  titel: Willibald – Quelltabellen
  urheber: DDVUG e.V.
  lizenz: CC BY 4.0
  lizenz_url: https://creativecommons.org/licenses/by/4.0/

# Eindeutig ist eine Tabelle erst mit ihrem Quellsystem: Webshop.Bestellung.
# Verweise (to, references) nennen darum stets System.Tabelle.
SourceTables:
  Webshop:
    Bestellung:
      business_object: Bestellung
      Domain: Willibald
      desc: Repräsentiert einen Kundenauftrag mit Bestell- und gewünschtem Lieferdatum sowie dem auf die Bestellung angewendeten Rabatt.
      business_keys:
      - BestellungID
      attributes:
      - name: BestellungID
        type: bigint
        nullable: false
        primary_key: true
      - name: KundeID
        type: char(13)
        nullable: false
        foreign_key: true
        references: Webshop.Kunde.KundeID
      - name: AllgLieferAdrID
        type: int
        nullable: false
        foreign_key: true
        references: Webshop.Lieferadresse.LieferAdrID
      - name: Bestelldatum
        type: date
        nullable: false
      - name: Wunschdatum
        type: date
        nullable: false
      - name: Rabatt
        type: numeric(5,2)
        nullable: false
      relationships:
      - to: Webshop.Position
        name: enthält
        cardinality:
          from: exactly_one
          to: zero_or_many
    Kategorie:
      business_object: Kategorie
      Domain: Willibald
      desc: Ordnet Produkte in eine hierarchische Warengruppenstruktur aus Ober- und Unterkategorien ein.
      business_keys:
      - KatID
      attributes:
      - name: KatID
        type: varchar(50)
        nullable: false
        primary_key: true
      - name: OberKatID
        type: varchar(50)
        nullable: true
        foreign_key: true
        references: Webshop.Kategorie.KatID
      - name: Name
        type: varchar(512)
        nullable: false
      relationships:
      - to: Webshop.Kategorie
        name: ist Oberkategorie von
        cardinality:
          from: exactly_one
          to: zero_or_many
      - to: Webshop.Produkt
        name: enthält
        cardinality:
          from: exactly_one
          to: zero_or_many
    Kunde:
      business_object: Kunde
      Domain: Willibald
      desc: Repräsentiert eine kaufende Person mit Stamm-, Kontakt-, Geburts- und Zahlungsdaten.
      business_keys:
      - KundeID
      attributes:
      - name: KundeID
        type: char(13)
        nullable: false
        primary_key: true
      - name: VereinsPartnerID
        type: varchar(30)
        nullable: true
        foreign_key: true
      - name: Vorname
        type: varchar(128)
        nullable: false
      - name: Name
        type: varchar(128)
        nullable: false
      - name: Geschlecht
        type: char
        nullable: true
      - name: Geburtsdatum
        type: date
        nullable: false
      - name: Telefon
        type: varchar(20)
        nullable: true
      - name: Mobil
        type: varchar(20)
        nullable: true
      - name: Email
        type: varchar(128)
        nullable: true
      - name: Kreditkarte
        type: varchar(30)
        nullable: false
      - name: GueltigBis
        type: char(5)
        nullable: false
      - name: KKFirma
        type: varchar(128)
        nullable: false
      relationships:
      - to: Webshop.Wohnort
        name: hat
        cardinality:
          from: exactly_one
          to: zero_or_many
      - to: Webshop.Lieferadresse
        name: verwendet
        cardinality:
          from: exactly_one
          to: zero_or_many
      - to: Webshop.Bestellung
        name: gibt auf
        cardinality:
          from: exactly_one
          to: zero_or_many
    LieferDienst:
      business_object: LieferDienst
      Domain: Willibald
      desc: Beschreibt einen Versand- oder Logistikdienstleister einschließlich seiner Kontakt- und Adressdaten.
      business_keys:
      - LieferDienstID
      attributes:
      - name: LieferDienstID
        type: varchar(30)
        nullable: false
        primary_key: true
      - name: Name
        type: varchar(128)
        nullable: false
      - name: Telefon
        type: varchar(20)
        nullable: false
      - name: Fax
        type: varchar(20)
        nullable: true
      - name: Email
        type: varchar(128)
        nullable: false
      - name: Strasse
        type: varchar(128)
        nullable: false
      - name: Hausnummer
        type: varchar(10)
        nullable: false
      - name: Plz
        type: varchar(10)
        nullable: false
      - name: Ort
        type: varchar(128)
        nullable: false
      - name: Land
        type: varchar(128)
        nullable: true
      relationships:
      - to: Webshop.Lieferung
        name: führt aus
        cardinality:
          from: exactly_one
          to: zero_or_many
    Lieferadresse:
      business_object: Lieferadresse
      Domain: Willibald
      desc: Enthält eine vom Kunden verwendete Adresse, an die Bestellungen oder einzelne Bestellpositionen geliefert werden können.
      business_keys:
      - LieferAdrID
      attributes:
      - name: LieferAdrID
        type: int
        nullable: false
        primary_key: true
      - name: KundeID
        type: char(13)
        nullable: false
        foreign_key: true
        references: Webshop.Kunde.KundeID
      - name: Strasse
        type: varchar(128)
        nullable: false
      - name: Hausnummer
        type: varchar(10)
        nullable: false
      - name: Adresszusatz
        type: varchar(128)
        nullable: true
      - name: Plz
        type: varchar(10)
        nullable: false
      - name: Ort
        type: varchar(128)
        nullable: false
      - name: Land
        type: varchar(128)
        nullable: true
      relationships:
      - to: Webshop.Bestellung
        name: ist allgemeine Lieferadresse für
        cardinality:
          from: exactly_one
          to: zero_or_many
      - to: Webshop.Position
        name: ist spezielle Lieferadresse für
        cardinality:
          from: exactly_one
          to: zero_or_many
      - to: Webshop.Lieferung
        name: ist Zieladresse von
        cardinality:
          from: exactly_one
          to: zero_or_many
    Lieferung:
      business_object: Lieferung
      Domain: Willibald
      desc: Dokumentiert die Zustellung einer Bestellposition an eine Lieferadresse durch einen Lieferdienst zu einem Lieferdatum.
      business_keys:
      - BestellungID
      - PosID
      - LieferAdrID
      - LieferDienstID
      attributes:
      - name: BestellungID
        type: bigint
        nullable: false
        primary_key: true
        foreign_key: true
        references: Webshop.Position.BestellungID
      - name: PosID
        type: bigint
        nullable: false
        primary_key: true
        foreign_key: true
        references: Webshop.Position.PosID
      - name: LieferAdrID
        type: int
        nullable: false
        primary_key: true
        foreign_key: true
        references: Webshop.Lieferadresse.LieferAdrID
      - name: LieferDienstID
        type: varchar(30)
        nullable: false
        primary_key: true
        foreign_key: true
        references: Webshop.LieferDienst.LieferDienstID
      - name: LieferDatum
        type: date
        nullable: false
    Position:
      business_object: Position
      Domain: Willibald
      desc: Repräsentiert eine einzelne Position einer Bestellung mit Produkt, Menge, Preis und gegebenenfalls abweichender Lieferadresse.
      business_keys:
      - BestellungID
      - PosID
      attributes:
      - name: BestellungID
        type: bigint
        nullable: false
        primary_key: true
        foreign_key: true
        references: Webshop.Bestellung.BestellungID
      - name: PosID
        type: bigint
        nullable: false
        primary_key: true
      - name: ProduktID
        type: int
        nullable: false
        foreign_key: true
        references: Webshop.Produkt.ProduktID
      - name: SpezLieferAdrID
        type: int
        nullable: true
        foreign_key: true
        references: Webshop.Lieferadresse.LieferAdrID
      - name: Menge
        type: int
        nullable: false
      - name: Preis
        type: numeric(10,2)
        nullable: false
      relationships:
      - to: Webshop.Lieferung
        name: wird erfüllt durch
        cardinality:
          from: exactly_one
          to: zero_or_many
    Produkt:
      business_object: Produkt
      Domain: Willibald
      desc: Beschreibt einen angebotenen Artikel mit Zuordnung zur Kategorie sowie Preis-, Typ-, Umfang- und Pflanzinformationen.
      business_keys:
      - ProduktID
      attributes:
      - name: ProduktID
        type: int
        nullable: false
        primary_key: true
      - name: KatID
        type: varchar(50)
        nullable: false
        foreign_key: true
        references: Webshop.Kategorie.KatID
      - name: Bezeichnung
        type: varchar(512)
        nullable: false
      - name: Umfang
        type: varchar(128)
        nullable: false
      - name: Typ
        type: int
        nullable: false
      - name: Preis
        type: decimal(5,2)
        nullable: false
      - name: Pflanzort
        type: varchar(128)
        nullable: false
      - name: Pflanzabstand
        type: varchar(128)
        nullable: false
      relationships:
      - to: Webshop.Position
        name: wird bestellt in
        cardinality:
          from: exactly_one
          to: zero_or_many
    Wohnort:
      business_object: WohnHistorie
      Domain: Willibald
      desc: Dokumentiert die zeitliche Historie der Wohnadressen eines Kunden mit Gültigkeitsbeginn und optionalem Gültigkeitsende.
      business_keys:
      - KundeID
      attributes:
      - name: KundeID
        type: char(13)
        nullable: false
        primary_key: true
        foreign_key: true
        references: Webshop.Kunde.KundeID
      - name: Von
        type: date
        nullable: false
        primary_key: true
      - name: Bis
        type: date
        nullable: true
      - name: Strasse
        type: varchar(128)
        nullable: false
      - name: Hausnummer
        type: varchar(10)
        nullable: false
      - name: Adresszusatz
        type: varchar(128)
        nullable: true
      - name: Plz
        type: varchar(10)
        nullable: false
      - name: Ort
        type: varchar(128)
        nullable: false
      - name: Land
        type: varchar(128)
        nullable: true
  Roadshow:
    Bestellung_VRS:
      business_object: Bestellung
      Domain: Willibald
      desc: Repräsentiert einen Kundenauftrag mit Bestell- und gewünschtem Lieferdatum sowie dem auf die Bestellung angewendeten Rabatt.
      business_keys:
      - BestellungID
      attributes:
      - name: BestellungID
        type: bigint
        nullable: false
        primary_key: true
      - name: KundeID
        type: char(13)
        nullable: false
        foreign_key: true
        references: Webshop.Kunde.KundeID
      - name: AllgLieferAdrID
        type: int
        nullable: false
        foreign_key: true
        references: Webshop.Lieferadresse.LieferAdrID
      - name: Bestelldatum
        type: date
        nullable: false
      - name: Wunschdatum
        type: date
        nullable: false
      - name: Rabatt
        type: numeric(5,2)
        nullable: false
      relationships:
      - to: Roadshow.Position_VRS
        name: enthält
        cardinality:
          from: exactly_one
          to: zero_or_many
    Position_VRS:
      business_object: Position
      Domain: Willibald
      desc: Repräsentiert eine einzelne Position einer Bestellung mit Produkt, Menge, Preis und gegebenenfalls abweichender Lieferadresse.
      business_keys:
      - BestellungID
      - PosID
      attributes:
      - name: BestellungID
        type: bigint
        nullable: false
        primary_key: true
        foreign_key: true
        references: Roadshow.Bestellung_VRS.BestellungID
      - name: PosID
        type: bigint
        nullable: false
        primary_key: true
      - name: ProduktID
        type: int
        nullable: false
        foreign_key: true
        references: Webshop.Produkt.ProduktID
      - name: SpezLieferAdrID
        type: int
        nullable: true
        foreign_key: true
        references: Webshop.Lieferadresse.LieferAdrID
      - name: Menge
        type: int
        nullable: false
      - name: Preis
        type: numeric(10,2)
        nullable: false
    VereinsPartner:
      business_object: VereinsPartner
      Domain: Willibald
      desc: Beschreibt einen Vereinspartner mit verantwortlichem Kunden beziehungsweise Vereinsvorsitz und gestaffelten Rabatten.
      business_keys:
      - VereinsPartnerID
      attributes:
      - name: VereinsPartnerID
        type: varchar(30)
        nullable: false
        primary_key: true
      - name: KundeIDVerein
        type: char(13)
        nullable: false
        foreign_key: true
        references: Webshop.Kunde.KundeID
      - name: Rabatt1
        type: int
        nullable: false
      - name: Rabatt2
        type: int
        nullable: false
      - name: Rabatt3
        type: int
        nullable: false
      relationships:
      - to: Roadshow.Bestellung_VRS
        name: begünstigt
        cardinality:
          from: exactly_one
          to: zero_or_many
  Referenzdaten:
    href_termintreue:
      business_object: href_termintreue
      Domain: Willibald
      desc: Definiert Wertebereiche zur fachlichen Klassifizierung der Termintreue anhand der Anzahl von Tagen.
      business_keys:
      - Anzahl_Tage_von
      - Anzahl_Tage_bis
